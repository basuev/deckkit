[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deckkit"
dynamic = ["version"]
description = "Independent Steam Deck tools with an on-demand installer and catalog"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
deckkit = "deckkit.__main__:main"

[project.optional-dependencies]
dev = ["ruff==0.17.4"]

[tool.setuptools.dynamic]
version = {attr = "deckkit.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 79
include = ["src/deckkit/**/*.py", "tests/**/*.py", "scripts/*.py"]

[tool.ruff.lint]
select = ["E4", "E501", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
